name: Release CI

on:
  workflow_dispatch:
  push:
    branches:
      - keremp

jobs:
  release-build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: 17
          distribution: "temurin"
          cache: "gradle"

      - name: Compile
        run: |
          ./gradlew assembleRelease

      - name: Sign Apk
        continue-on-error: false
        id: sign_apk
        uses: ilharp/sign-android-release@v2
        with:
          releaseDir: app/build/outputs/apk/release
          signingKey: ${{ secrets.ANDROID_SIGNING_KS }}
          keyAlias: ${{ secrets.ANDROID_SIGNING_KEY_ALIAS }}
          keyStorePassword: ${{ secrets.ANDROID_SIGNING_KS_PASSWORD }}
          keyPassword: ${{ secrets.ANDROID_SIGNING_KEY_PASSWORD }}

      - name: Get short commit SHA
        id: get_short_commit_sha
        run: |
          echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Rename Apk
        id: rename_apk
        run: |
          SHORT_SHA=${{ steps.get_short_commit_sha.outputs.short_sha }}
          mv app/build/outputs/apk/release/app-release-unsigned-signed.apk Twelve-keremp-$SHORT_SHA.apk
      
      - name: Upload APK
        uses: actions/upload-artifact@v5
        with:
          name: Twelve-keremp.apk
          path: ./*.apk


